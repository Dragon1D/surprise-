<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagi Gaji Jadi 3 Kantong</title>
<style>
  @font-face { font-family: Pop; src: url(fonts/poppins-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Pop; src: url(fonts/poppins-800.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Pop; src: url(fonts/poppins-900.woff2) format('woff2'); font-weight: 900; }
  html, body { margin: 0; background: #1d1b26; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { height: 100vh; width: auto; aspect-ratio: 9 / 16; display: block; font-family: Pop, sans-serif; }
  body.render { display: block; min-height: 0; }
  body.render svg { width: 720px; height: 1280px; }
</style>
</head>
<body>
<svg id="v" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* Bokek Anonim · Sesi #1 · Video tips "Bagi gaji jadi 3 kantong" — v2 (standar PANDUAN-VIDEO-MOTION)
   21 dtk = 42 beat @120 BPM = 6 adegan x 3,5 dtk. Semua dihitung dari t (deterministik).
   CUE = satu-satunya tempat angka waktu: gambar DAN bunyi membaca dari sini. */

const C = { bg: '#f4ede1', ink: '#1d1b26', yel: '#ffd84d', cor: '#ef6f50', corD: '#c9553b', vio: '#5b4bff', vioD: '#4335d8', grn: '#1fa971', grnD: '#168457', red: '#e5483b', mute: '#6b6357', white: '#fffdf6', blob: '#ebe1cf' };
const SC = 3.5, DURATION = 21, FPS = 30;
window.DURATION = DURATION;

/* ---------- CUE: semua waktu (detik lokal per adegan, kecuali bounds) ---------- */
const CUE = {
  bounds: [3.5, 7, 10.5, 14, 17.5],
  hook: { bills: [.35, .73, 1.11, 1.49], flyDur: .55, cal: [.1, 2.0], squash: [2.0, 2.5], stamp: 2.5, emph: 2.5 },
  data: { bars: [.35, .85, 1.35], barDur: .5, pouches: [1.9, 2.08, 2.26], src: 2.4 },
  inti: { pouch: .05, coin0: .4, coinStep: .24, coinDur: .4, icons: [1.0, 1.2, 1.4], amtEnd: 2.0, chips: [2.3, 2.6, 2.9] },
  dampak: { cardA: .25, x: 1.0, arrow: [1.25, 1.7], cardB: 1.5, coins: [1.95, 2.15, 2.35, 2.55], fill: [1.95, 2.9], check: 2.9 },
  cta: { match: .45, logo: .45, name: .6, btn: 1.2, press: 1.9, saved: 2.05, src: 1.6 },
};
const S0 = i => i * SC; // awal adegan i (global)

/* ---------- helper ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eout = k => 1 - Math.pow(1 - k, 3);
const ein = k => k * k * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const back = k => { const c1 = 1.9, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
// pegas teredam (overshoot lalu mengendap); dt = detik sejak mulai
const spr = (dt, zeta = .42, w = 15) => { if (dt <= 0) return 0; const wd = w * Math.sqrt(1 - zeta * zeta); return 1 - Math.exp(-zeta * w * dt) * (Math.cos(wd * dt) + zeta / Math.sqrt(1 - zeta * zeta) * Math.sin(wd * dt)); };
// squash & stretch saat mendarat; dt = detik sejak menyentuh
const squash = dt => { const k = dt < 0 ? 0 : Math.max(0, 1 - dt / .33) * Math.cos(dt * 27); return { sx: 1 + .22 * k, sy: 1 - .22 * k }; };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f = n => (+n).toFixed(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const rp = n => 'Rp' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const ST = `stroke="${C.ink}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
const txt = (x, y, s, o = {}) => `<text x="${f(x)}" y="${f(y)}" text-anchor="${o.anchor || 'middle'}" font-size="${o.size || 32}" font-weight="${o.weight || 800}" fill="${o.fill || C.ink}" letter-spacing="${o.ls || 0}" opacity="${o.op ?? 1}">${esc(s)}</text>`;
const pop = (k, x, y, inner, rot = 0) => k <= 0 ? '' : `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)}) scale(${back(k).toFixed(3)})">${inner}</g>`;
const popS = (dt, x, y, inner, rot = 0) => dt <= 0 ? '' : `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot + (1 - spr(dt)) * -8)}) scale(${spr(dt).toFixed(3)})">${inner}</g>`;
const breathe = (t, ph = 0) => 1 + Math.sin(t * 2.6 + ph) * .02;
let UID = 0; // id clipPath unik per frame

/* ---------- objek vektor ---------- */
function bill(w = 220, h = 110) {
  return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="16" fill="${C.yel}" ${ST}/>
    <rect x="${-w / 2 + 16}" y="${-h / 2 + 14}" width="${w - 32}" height="${h - 28}" rx="10" fill="none" stroke="${C.ink}" stroke-width="3" opacity=".35"/>
    <circle r="${h * .26}" fill="${C.white}" ${ST}/>${txt(0, h * .1, 'Rp', { size: h * .26 })}`;
}
function coin(r = 26) { return `<circle r="${r}" fill="${C.yel}" ${ST}/><circle r="${r * .66}" fill="none" stroke="${C.ink}" stroke-width="3" opacity=".4"/>${txt(0, r * .32, 'Rp', { size: r * .8 })}`; }
// kantong: karung kain bertali (leher dikerut, lipatan kain, tali menjuntai); fill 0..1 naik dari bawah
function pouch(col, colD, fill = 0, label = '', amount = '', s = 1, face = 'ok') {
  const body = 'M-52 -58 C-98 -42 -126 8 -112 58 C-100 104 -58 116 0 116 C58 116 100 104 112 58 C126 8 98 -42 52 -58 Z';
  const fh = 176 * clamp(fill), id = 'pc' + col.slice(1);
  let g = `<g transform="scale(${s})"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>`;
  g += `<path d="${body}" fill="${C.white}"/>`;
  g += `<g clip-path="url(#${id})"><rect x="-130" y="${f(116 - fh)}" width="260" height="${f(fh + 2)}" fill="${col}"/>`;
  // bayangan kain di sisi kanan
  g += `<path d="M70 -40 C112 0 116 70 60 112 L140 112 L140 -60 Z" fill="${C.ink}" opacity=".08"/></g>`;
  // lipatan kain dari leher ke badan
  g += `<path d="M-34 -52 Q-50 -28 -44 -2 M34 -52 Q50 -28 44 -2 M-6 -56 Q-2 -42 -8 -26 M-70 92 Q-40 104 -14 100" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>`;
  g += `<path d="${body}" fill="none" ${ST}/>`;
  // kerutan kain di atas ikatan
  g += `<path d="M-50 -60 L-74 -104 Q-56 -90 -40 -108 Q-20 -90 0 -110 Q20 -90 40 -108 Q56 -90 74 -104 L50 -60 Z" fill="${colD}" ${ST}/>`;
  g += `<rect x="-62" y="-72" width="124" height="20" rx="10" fill="${C.ink}"/>`;
  // tali menjuntai dengan simpul
  g += `<path d="M48 -62 C84 -56 98 -28 90 6 M48 -62 C74 -48 74 -26 64 -10" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="10" r="7" fill="${C.ink}"/><circle cx="63" cy="-6" r="6" fill="${C.ink}"/>`;
  // wajah kecil
  if (face === 'ok') g += `<circle cx="-26" cy="26" r="7" fill="${C.ink}"/><circle cx="26" cy="26" r="7" fill="${C.ink}"/><path d="M-14 48 q14 12 28 0" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`;
  if (face === 'sad') g += `<circle cx="-26" cy="26" r="7" fill="${C.ink}"/><circle cx="26" cy="26" r="7" fill="${C.ink}"/><path d="M-14 54 q14 -12 28 0" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`;
  if (label) g += txt(0, 156, label, { size: 30 });
  if (amount) g += txt(0, 196, amount, { size: 34, fill: colD });
  return g + '</g>';
}
const ICON = {
  rumah: `<path d="M-38 -4 L0 -38 L38 -4" fill="none" ${ST}/><rect x="-30" y="-8" width="60" height="44" rx="6" fill="${C.white}" ${ST}/><rect x="-9" y="12" width="18" height="24" rx="3" fill="${C.cor}" ${ST}/>`,
  makan: `<path d="M-40 -2 h80 a40 36 0 0 1 -80 0z" fill="${C.white}" ${ST}/><path d="M-14 -14 q-8 -12 0 -24 M6 -14 q-8 -12 0 -24" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`,
  bus: `<rect x="-40" y="-32" width="80" height="58" rx="12" fill="${C.yel}" ${ST}/><rect x="-28" y="-20" width="24" height="18" rx="3" fill="${C.white}" stroke="${C.ink}" stroke-width="3"/><rect x="4" y="-20" width="24" height="18" rx="3" fill="${C.white}" stroke="${C.ink}" stroke-width="3"/><circle cx="-22" cy="28" r="9" fill="${C.ink}"/><circle cx="22" cy="28" r="9" fill="${C.ink}"/>`,
  kopi: `<path d="M-28 -20 h56 l-8 54 h-40 z" fill="${C.white}" ${ST}/><path d="M28 -6 q20 0 16 18 q-4 12 -18 10" fill="none" ${ST}/><rect x="-32" y="-30" width="64" height="12" rx="5" fill="${C.cor}" ${ST}/>`,
  tiket: `<path d="M-44 -24 h88 v14 a10 10 0 0 0 0 20 v14 h-88 v-14 a10 10 0 0 0 0 -20 z" fill="${C.yel}" ${ST}/><path d="M10 -18 v36" stroke="${C.ink}" stroke-width="3" stroke-dasharray="5 5"/>`,
  belanja: `<rect x="-32" y="-16" width="64" height="54" rx="8" fill="${C.cor}" ${ST}/><path d="M-16 -16 q0 -26 16 -26 q16 0 16 26" fill="none" ${ST}/>`,
};
function calendar(day) {
  return `<rect x="-62" y="-70" width="124" height="140" rx="18" fill="${C.white}" ${ST}/><rect x="-62" y="-70" width="124" height="40" rx="18" fill="${C.red}" ${ST}/>
    <rect x="-62" y="-48" width="124" height="18" fill="${C.red}"/><path d="M-62 -30 h124" stroke="${C.ink}" stroke-width="5"/>
    ${txt(0, -40, 'TANGGAL', { size: 16, fill: C.white, ls: 2 })}${txt(0, 46, String(day), { size: 66 })}`;
}
const LOGO = `<rect x="18" y="40" width="84" height="46" rx="14" fill="#ef6f50" stroke="#1d1b26" stroke-width="4.5"/><path d="M68 52 h34 v22 h-34 a11 11 0 0 1 0 -22z" fill="#c9553b" stroke="#1d1b26" stroke-width="4"/><circle cx="31" cy="57" r="10" fill="#1d1b26"/><circle cx="54" cy="57" r="10" fill="#1d1b26"/><path d="M41 56 h3" stroke="#1d1b26" stroke-width="4"/><circle cx="28" cy="54" r="3" fill="#fff" opacity=".7"/><circle cx="51" cy="54" r="3" fill="#fff" opacity=".7"/><path d="M30 74 q6 -6 12 0 q6 -6 12 0 q-6 5 -12 1 q-6 4 -12 -1z" fill="#1d1b26"/>`;

/* ---------- tipografi kinetik: mask-reveal per kata + pegas ---------- */
const MARK = { '*': C.cor, '_': C.grn, '^': C.vio };
const _cv = document.createElement('canvas').getContext('2d'), _wc = {};
const measure = (s, size, weight, ls) => { const k = s + size + weight; if (!(k in _wc)) { _cv.font = `${weight} ${size}px Pop`; _wc[k] = _cv.measureText(s).width; } return _wc[k] + ls * s.length; };
function kinetic(l, lines, o = {}) {
  const size = o.size || 64, y0 = o.y || 300, lh = size * 1.14, d0 = o.delay ?? .05, stg = o.stagger ?? .1, W = 800, LS = -1.5;
  let s = '', wi = 0;
  lines.forEach((line, li) => {
    const y = y0 + li * lh, id = 'kc' + (UID++);
    const words = line.split(' ').map(w => { const m = w.match(/^([*_^])(.+?)\1(.*)$/); return m ? { a: m[2], b: m[3], col: MARK[m[1]] } : { a: w, b: '', col: null }; });
    const sp = measure(' ', size, W, LS), ws = words.map(w => measure(w.a + w.b, size, W, LS));
    let x = 360 - (ws.reduce((p, c) => p + c, 0) + sp * (words.length - 1)) / 2;
    s += `<clipPath id="${id}"><rect x="-200" y="${f(y - size * 1.3)}" width="1120" height="${f(size * 1.62)}"/></clipPath><g clip-path="url(#${id})">`;
    words.forEach((w, j) => {
      const p = o.instant ? 1 : spr(l - (d0 + wi * stg)); wi++;
      const e = w.col && o.emph ? o.emph(w.a) : null;
      const inner = `<text x="${f(x)}" y="${f(y)}" font-size="${size}" font-weight="${W}" letter-spacing="${LS}" fill="${C.ink}"><tspan fill="${e?.fill || w.col || C.ink}">${esc(w.a)}</tspan>${esc(w.b)}</text>`;
      const cx = x + ws[j] / 2, cy = y - size * .35;
      let tr = `translate(0 ${f((1 - p) * size * 1.15)}) rotate(${f((1 - p) * 7)} ${f(x)} ${f(y)})`;
      if (e) tr += ` translate(${f(cx + e.dx)} ${f(cy + e.dy)}) rotate(${f(e.rot || 0)}) scale(${e.scale.toFixed(3)}) translate(${f(-cx)} ${f(-cy)})`;
      s += `<g transform="${tr}">${inner}</g>`;
      x += ws[j] + sp;
    });
    s += `</g>`;
  });
  return s;
}

/* ---------- adegan ---------- */
const SCENES = [
  // 1 HOOK: judul tampil di frame 0; uang terbang + sisa gaji menghitung turun; stempel TIPIS + kata "tipis" slam di 2,5
  (l, t) => {
    const H = CUE.hook;
    const ed = l - H.emph, slam = ed >= 0 ? 1 + (1 - spr(ed, .35, 18)) * .28 : 1, sh = ed >= 0 && ed < .45 ? Math.sin(ed * 70) * 7 * (1 - ed / .45) : 0;
    const head = kinetic(l, ['Gaji 5 juta,', 'tanggal 10 udah *tipis*?'], { instant: true, y: 290, size: 60,
      emph: () => ({ scale: slam, dx: sh, dy: 0, rot: ed >= 0 ? -4 * (1 - spr(ed)) : 0, fill: ed >= 0 ? C.red : null }) });
    let s = '';
    // kalender: tiap ganti tanggal, halaman "dibalik" (squash vertikal lalu mengendap)
    const span = H.cal[1] - H.cal[0], day = Math.min(10, 1 + Math.floor(prog(l, H.cal[0], H.cal[1]) * 9.999));
    const since = l < H.cal[0] ? 9 : (l - H.cal[0]) % (span / 9), flip = l > H.cal[1] + .2 ? 1 : 1 - (1 - spr(since, .4, 22)) * .35;
    s += `<g transform="translate(565 ${f(700 + Math.sin(t * 3) * 4)}) rotate(6) scale(1 ${f(flip)})">${calendar(day)}</g>`;
    // tumpukan uang: lembar atas mundur sedikit (antisipasi) lalu terbang
    for (let i = 4; i >= 1; i--) {
      const t0 = H.bills[4 - i], k = prog(l, t0, t0 + H.flyDur), ant = Math.sin(prog(l, t0 - .12, t0) * Math.PI) * 8;
      const fly = eio(k);
      const x = 280 + fly * 520 + Math.sin(fly * 3) * 20, y = 760 - i * 22 - fly * 520 - Math.sin(fly * Math.PI) * 60 + ant;
      if (fly < 1) s += `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(-6 + fly * 140)}) scale(${f(1 - fly * .25)})">${bill()}</g>`;
    }
    const sq = prog(l, H.squash[0], H.squash[1]), wob = Math.sin(t * 18) * 3 * prog(l, 2.5, 2.7) * (1 - prog(l, 2.7, 3.3));
    s += `<g transform="translate(${f(280 + wob)} 760) scale(${f(1 + sq * .08)} ${f(1 - sq * .55)})">${bill()}</g>`;
    // sisa gaji: menghitung turun, tiap lembar pill memantul
    let gone = 0;
    H.bills.forEach(b => gone += eio(prog(l, b, b + H.flyDur)));
    const left = 5000000 - gone * 1000000;
    const bump = H.bills.reduce((a, b) => a + Math.max(0, Math.sin(prog(l, b + .3, b + .55) * Math.PI)) * .07, 0);
    s += `<g transform="translate(280 852) scale(${f(1 + bump)})"><rect x="-150" y="-32" width="300" height="64" rx="32" fill="${C.white}" ${ST}/>${txt(0, 14, rp(Math.round(left / 50000) * 50000), { size: 38, fill: prog(l, 1.6, 2.1) > .5 ? C.red : C.ink })}</g>`;
    // stempel: turun dari besar, squash saat mendarat, debu memercik
    const st = prog(l, H.stamp - .25, H.stamp);
    if (st > 0) {
      const sc = st < 1 ? lerp(2.4, 1, ein(st)) : 1, q = squash(l - H.stamp);
      s += `<g transform="translate(330 955) rotate(-10) scale(${f(sc * q.sx)} ${f(sc * q.sy)})" opacity="${f(Math.min(1, st * 3))}"><rect x="-120" y="-44" width="240" height="88" rx="14" fill="${C.bg}" stroke="${C.red}" stroke-width="9"/>${txt(0, 22, 'TIPIS', { size: 64, fill: C.red, ls: 6, weight: 900 })}</g>`;
      const dk = prog(l, H.stamp, H.stamp + .45);
      if (dk > 0 && dk < 1) for (let i = 0; i < 9; i++) {
        const a = Math.PI * (1.05 + i * .1), r = eout(dk) * (70 + rnd(i) * 50);
        s += `<circle cx="${f(330 + Math.cos(a) * (130 + r))}" cy="${f(990 + Math.sin(a) * r * .5)}" r="${f((1 - dk) * (5 + rnd(i + 9) * 5))}" fill="${C.ink}" opacity=".35"/>`;
      }
    }
    return s + head;
  },
  // 2 DATA: bar 50/30/20 menggambar diri + persen menghitung, 3 karung mendarat
  (l, t) => {
    const D = CUE.data;
    let s = kinetic(l, ['Pakai rumus', '*50* / ^30^ / _20_'], { y: 280, size: 72 });
    const X0 = 80, W = 560, Y = 520, H = 96, id = 'bar' + (UID++);
    const segs = [[.5, C.cor, 'Kebutuhan', C.corD], [.3, C.vio, 'Keinginan', C.vioD], [.2, C.grn, 'Masa depan', C.grnD]];
    let acc = 0; const labels = [];
    const bk = spr(l - .1, .5, 14);
    s += `<g transform="translate(360 ${Y + H / 2}) scale(${f(bk)} 1) translate(-360 ${-(Y + H / 2)})"><rect x="${X0}" y="${Y}" width="${W}" height="${H}" rx="22" fill="${C.white}" ${ST}/>`;
    s += `<clipPath id="${id}"><rect x="${X0}" y="${Y}" width="${W}" height="${H}" rx="22"/></clipPath><g clip-path="url(#${id})">`;
    segs.forEach(([p, col], i) => {
      const t0 = D.bars[i], k = eout(prog(l, t0, t0 + D.barDur));
      const x = X0 + acc * W, w = p * W * k;
      s += `<rect x="${f(x)}" y="${Y}" width="${f(w)}" height="${H}" fill="${col}"/>`;
      if (k > 0 && i > 0) s += `<path d="M${f(x)} ${Y} v${H}" stroke="${C.ink}" stroke-width="5"/>`;
      if (k > 0) { const pb = 1 + Math.sin(prog(l, t0 + D.barDur, t0 + D.barDur + .25) * Math.PI) * .2; labels.push(`<g transform="translate(${f(x + p * W / 2)} ${Y + 62}) scale(${f(pb)})">${txt(0, 0, Math.round(p * 100 * k) + '%', { size: 40, fill: C.white, weight: 900 })}</g>`); }
      acc += p;
    });
    s += `</g><rect x="${X0}" y="${Y}" width="${W}" height="${H}" rx="22" fill="none" ${ST}/>` + labels.join('') + '</g>';
    // karung jatuh dari atas, squash saat mendarat
    segs.forEach(([p, col, name, colD], i) => {
      const t0 = D.pouches[i], k = prog(l, t0, t0 + .28), x = 160 + i * 200, op = clamp(k * 3);
      if (k <= 0) return;
      const y = lerp(700, 790, ein(k)) + Math.sin(t * 4 + i) * 4 * prog(l, t0 + .5, t0 + .8), q = squash(l - t0 - .28);
      s += `<g opacity="${f(op)}" transform="translate(${x} ${f(y)}) scale(${f(q.sx * breathe(t, i))} ${f(q.sy * breathe(t, i))})">${pouch(col, colD, .45, '', '', .62)}</g>`;
      s += `<g opacity="${f(Math.min(1, prog(l, t0 + .2, t0 + .4) * 1))}">${txt(x, 910, name, { size: 28 })}</g>`;
    });
    s += `<g opacity="${f(eout(prog(l, D.src, D.src + .4)))}">${txt(360, 995, 'Sumber: buku All Your Worth (Warren & Tyagi)', { size: 24, weight: 600, fill: C.mute })}</g>`;
    return s;
  },
  (l, t) => kantongScene(l, t, { pct: '*50%*', name: 'kebutuhan', col: C.cor, colD: C.corD, amount: 2500000, icons: ['rumah', 'makan', 'bus'], sub: 'kos · makan · transport' }),
  (l, t) => kantongScene(l, t, { pct: '^30%^', name: 'keinginan', col: C.vio, colD: C.vioD, amount: 1500000, icons: ['kopi', 'tiket', 'belanja'], sub: 'nongkrong · jajan · langganan', mirror: true }),
  // 5 DAMPAK: sebelum (nabung dari sisa = Rp0) dicoret → sesudah (nabung duluan = Rp1 jt) ✓
  (l, t) => {
    const D = CUE.dampak;
    let s = kinetic(l, ['_20%_ masa depan:', 'pindahin _duluan_'], { y: 270, size: 58 });
    const card = (label, sub, stroke, lc) => `<rect x="-150" y="-190" width="300" height="400" rx="26" fill="${C.white}" stroke="${stroke}" stroke-width="${stroke === C.ink ? 5 : 7}"/>${txt(0, -142, label, { size: 27, ls: 3, fill: lc })}${txt(0, -104, sub, { size: 27 })}`;
    const shrinkA = 1 - prog(l, D.x + .25, D.x + .5) * .06; // kartu lama sedikit mengecil setelah dicoret
    s += `<g transform="translate(190 640) scale(${f(shrinkA)}) translate(-190 -640)">` + popS(l - D.cardA, 190, 640, card('SEBELUM', 'nabung dari sisa', C.ink, C.mute) + `<g transform="translate(0 20)">${pouch(C.grn, C.grnD, 0, '', '', .7, 'sad')}</g>${txt(0, 175, 'Rp0', { size: 38, fill: C.red, weight: 900 })}`) + '</g>';
    const x = prog(l, D.x - .2, D.x);
    if (x > 0) s += `<g transform="translate(190 640) scale(${f(lerp(2, 1, ein(x)))})" opacity="${f(Math.min(1, x * 3))}"><path d="M-70 -70 L70 70 M70 -70 L-70 70" stroke="${C.red}" stroke-width="16" stroke-linecap="round"/></g>`;
    // panah menggambar diri
    const ar = eout(prog(l, D.arrow[0], D.arrow[1]));
    if (ar > 0) s += `<path d="M350 640 h40 M376 624 l16 16 l-16 16" fill="none" stroke="${C.ink}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" stroke-dashoffset="${f(120 * (1 - ar))}"/>`;
    const fill = eout(prog(l, D.fill[0], D.fill[1]));
    s += popS(l - D.cardB, 545, 640, card('SESUDAH', 'nabung duluan', C.grn, C.grnD) + `<g transform="translate(0 20) scale(${f(breathe(t))})">${pouch(C.grn, C.grnD, fill * .8, '', '', .7, 'ok')}</g>${txt(0, 175, rp(Math.round(1000000 * fill / 50000) * 50000), { size: 38, fill: C.grnD, weight: 900 })}`);
    // koin melompat dari samping kartu ke mulut karung, lengkung di bawah label
    D.coins.forEach((c0, i) => {
      const k = prog(l, c0, c0 + .45), side = i % 2 ? 1 : -1;
      const cx = lerp(545 + side * 115, 545 + side * 8, eio(k)), cy = lerp(640, 600, eio(k)) - Math.sin(k * Math.PI) * 30;
      if (k > 0 && k < 1) s += `<g transform="translate(${f(cx)} ${f(cy)}) rotate(${f(side * k * 180)}) scale(${f(Math.min(1, k * 4))})">${coin(18)}</g>`;
    });
    s += popS(l - D.check, 650, 470, `<circle r="36" fill="${C.grn}" ${ST}/><path d="M-15 0 l10 11 l20 -22" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`);
    return s;
  },
  // 6 CTA: match-cut dari koin → lingkaran logo; ajakan simpan, sumber
  (l, t) => {
    const K = CUE.cta;
    let s = kinetic(l, ['Simpan, terus', 'coba _gajian_ _depan_'], { y: 300, size: 62 });
    const bob = Math.sin(t * 2) * 3;
    s += `<g transform="translate(360 600) rotate(${f(bob)}) scale(${f(breathe(t))})"><circle r="150" fill="${C.yel}" ${ST}/>${popS(l - K.logo, 0, 0, `<g transform="translate(-130 -142) scale(2.17)">${LOGO}</g>`)}</g>`;
    const nk = spr(l - K.name);
    s += `<g opacity="${f(clamp(nk))}" transform="translate(0 ${f((1 - nk) * 24)})">${txt(360, 815, 'Bokek Anonim', { size: 54, weight: 900 })}${txt(360, 852, 'kelompok dukungan buat gaji', { size: 27, weight: 600, fill: C.mute })}${txt(360, 885, 'yang numpang lewat', { size: 27, weight: 600, fill: C.mute })}</g>`;
    const press = Math.sin(prog(l, K.press, K.press + .3) * Math.PI), saved = l > K.saved;
    s += popS(l - K.btn, 360, 962, `<g transform="scale(${f(1 - press * .12)})"><rect x="-160" y="-38" width="320" height="76" rx="38" fill="${press > 0 || saved ? C.ink : C.white}" ${ST}/>
      <path d="M-108 -18 h26 v38 l-13 -10 l-13 10 z" fill="${saved ? C.yel : 'none'}" stroke="${saved ? C.yel : C.ink}" stroke-width="4" stroke-linejoin="round"/>
      ${txt(18, 11, saved ? 'Tersimpan' : 'Simpan', { size: 30, fill: saved ? C.white : C.ink })}</g>`);
    s += `<g opacity="${f(eout(prog(l, K.src, K.src + .4)))}">${txt(360, 1050, 'Sumber rumus: All Your Worth · gaji = contoh', { size: 24, weight: 600, fill: C.mute })}</g>`;
    return s;
  },
];

function kantongScene(l, t, o) {
  const I = CUE.inti, dir = o.mirror ? -1 : 1, mx = x => o.mirror ? 720 - x : x;
  let s = kinetic(l, [`${o.pct} ${o.name}`], { y: 290, size: 76 });
  const fill = eout(prog(l, I.coin0, I.amtEnd)), k = prog(l, I.pouch, I.pouch + .35), bob = Math.sin(t * 3.4) * 6;
  let gulp = 0;
  for (let i = 0; i < 6; i++) { const land = I.coin0 + i * I.coinStep + I.coinDur; gulp += Math.sin(prog(l, land - .02, land + .15) * Math.PI) * .045; }
  s += `<g transform="translate(360 ${f(660 + bob)}) scale(${f((1 + gulp) * breathe(t))} ${f((1 - gulp) * breathe(t, 1))})">${pop(k, 0, 0, pouch(o.col, o.colD, fill * .85, '', '', 1.4, 'ok'), dir * -3)}</g>`;
  for (let i = 0; i < 6; i++) {
    const t0 = I.coin0 + i * I.coinStep, c = prog(l, t0, t0 + I.coinDur);
    if (c > 0 && c < 1) s += `<g transform="translate(${f(360 + dir * lerp(170, (rnd(i + o.amount) - .5) * 50, eio(c)))} ${f(lerp(370, 530, ein(c)) - Math.sin(c * Math.PI) * 60)}) rotate(${f(dir * c * 220)}) scale(${f(1 - c * .2)})">${coin(24)}</g>`;
  }
  // nominal menghitung naik, slam di akhir + kilau garis
  const ab = l >= I.amtEnd ? 1 + (1 - spr(l - I.amtEnd, .35, 18)) * .25 : 1;
  s += `<g transform="translate(360 935) scale(${f(ab)})">${txt(0, 0, rp(Math.round(o.amount * fill / 50000) * 50000), { size: 64, fill: o.colD, weight: 900 })}</g>`;
  const gk = prog(l, I.amtEnd, I.amtEnd + .4);
  if (gk > 0 && gk < 1) for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (i - 2.5) * .5, r0 = 150 + eout(gk) * 30, r1 = r0 + 26 * (1 - gk);
    s += `<path d="M${f(360 + Math.cos(a) * r0 * 1.4)} ${f(918 + Math.sin(a) * r0 * .45)} L${f(360 + Math.cos(a) * r1 * 1.4)} ${f(918 + Math.sin(a) * r1 * .45)}" stroke="${o.col}" stroke-width="6" stroke-linecap="round"/>`;
  }
  const chips = o.sub.split(' · ');
  o.icons.forEach((ic, i) => {
    const hi = Math.sin(prog(l, I.chips[i], I.chips[i] + .25) * Math.PI) * .25;
    const pos = [[140, 520], [580, 520], [590, 780]][i];
    s += `<g transform="translate(${f(mx(pos[0]))} ${f(pos[1] + Math.sin(t * 3 + i * 2) * 6)}) scale(${f(1 + hi)})">${popS(l - I.icons[i], 0, 0, ICON[ic], Math.sin(t * 2 + i) * 4)}</g>`;
  });
  const widths = chips.map(c => measure(c, 27, 800, 0) + 40), gap = 14, total = widths.reduce((a, b) => a + b, 0) + gap * (chips.length - 1);
  let cx = 360 - total / 2;
  chips.forEach((c, i) => {
    const w = widths[i];
    s += popS(l - I.chips[i], cx + w / 2, 1002, `<rect x="${f(-w / 2)}" y="-25" width="${f(w)}" height="50" rx="25" fill="${o.colD}" ${ST}/>${txt(0, 10, c, { size: 27, fill: C.white })}`, (i - 1) * 3);
    cx += w + gap;
  });
  return s;
}

/* ---------- kamera, kedalaman, guncangan ---------- */
function cam(i, l) { // push-in 1.00→1.05, pan kecil, rotasi ≤ 0,8°
  const p = clamp(l / SC), d = [1, -1, 1, -1, 1, 1][i];
  return `translate(360 640) scale(${(1 + .05 * p).toFixed(4)}) rotate(${f(.8 * d * (p - .5))}) translate(${f(-360 - 12 * d * p)} ${f(-640 - 8 * p)})`;
}
const IMPACTS = [[2.5, 13], [S0(2) + CUE.inti.amtEnd, 5], [S0(3) + CUE.inti.amtEnd, 5], [S0(4) + CUE.dampak.x, 10], [S0(4) + CUE.dampak.check, 6], [S0(5) + CUE.cta.match, 7]];
function shake(t) {
  let x = 0, y = 0;
  IMPACTS.forEach(([ti, a]) => { const fr = (t - ti) * FPS; if (fr >= 0 && fr < 14) { x += Math.sin(fr * 2.4) * (14 - fr) / 14 * a; y += Math.cos(fr * 2.1) * (14 - fr) / 14 * a * .6; } });
  return `translate(${f(x)} ${f(y)})`;
}
const TINT = [C.cor, C.vio, C.cor, C.vio, C.grn, C.yel];
function backdrop(t, i, l) {
  const p = clamp(l / SC);
  let s = `<rect x="-40" y="-40" width="800" height="1360" fill="${C.bg}"/>`;
  const off = (t * 10) % 40;
  s += `<defs><pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(${f(off)} ${f(off * .6)})"><circle cx="6" cy="6" r="3" fill="${C.ink}" opacity=".07"/></pattern></defs><rect x="-40" y="-40" width="800" height="1360" fill="url(#dots)"/>`;
  // lapisan tengah: bentuk datar besar, ikut warna adegan, parallax pelan
  [[110, 420, 170], [640, 880, 210], [90, 1120, 140]].forEach(([x, y, r], k) => {
    s += `<g transform="translate(${f(x - 20 * p + Math.sin(t * .6 + k) * 10)} ${f(y - 12 * p + Math.cos(t * .5 + k) * 8)}) rotate(${f(t * 6 * (k % 2 ? 1 : -1))})"><rect x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" rx="${r * .45}" fill="${TINT[i]}" opacity=".09"/></g>`;
  });
  return s;
}
function foreground(t, l) { // partikel depan, naik pelan dengan ayunan (deterministik)
  const p = clamp(l / SC); let s = '';
  for (let k = 0; k < 12; k++) {
    const sp = 18 + rnd(k) * 30, y = 1300 - ((t * sp + rnd(k + 40) * 1400) % 1400), x = rnd(k + 80) * 720 + Math.sin(t * 1.3 + k) * 14 - 30 * p;
    s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(3 + rnd(k + 20) * 5)}" fill="${k % 3 ? C.ink : C.yel}" opacity="${k % 3 ? .1 : .6}"/>`;
  }
  return s;
}

/* ---------- transisi (tiap batas berbeda, tiap transisi ber-SFX) ---------- */
const TRANS = [
  { k: 'wipe', cols: [C.yel, C.ink], axis: 'y' }, // 3,5 panel berlapis naik
  { k: 'iris', cx: 360, cy: 660, ring: C.cor },   // 7 lingkaran membuka dari karung
  { k: 'push', dir: 1 },                           // 10,5 adegan 4 didorong masuk dari KIRI
  { k: 'wipe', cols: [C.grn, C.ink], axis: 'x' },  // 14 panel berlapis menyamping
  { k: 'grow', from: [545, 600], to: [360, 600] }, // 17,5 koin membesar → jadi lingkaran logo (match-cut)
];
const scene = (i, l, t) => `<g transform="${cam(i, l)}">${SCENES[i](l, t)}</g>`;
function stage(t) {
  const i = Math.min(5, Math.floor(t / SC)), l = t - i * SC;
  let body = scene(i, l, t), over = '';
  CUE.bounds.forEach((b, j) => {
    const T = TRANS[j];
    if (T.k === 'push' && t > b - .25 && t < b + .25) {
      const k = eio(prog(t, b - .25, b + .25));
      body = `<g transform="translate(${f(k * 720 * T.dir)} 0)">${scene(j, Math.min(SC, t - S0(j)), t)}</g><g transform="translate(${f((k - 1) * 720 * T.dir)} 0)">${scene(j + 1, Math.max(0, t - b), t)}</g>`;
    }
    if (T.k === 'iris' && t >= b && t < b + .45) {
      const k = eout(prog(t, b, b + .45)), r = 10 + k * 900, id = 'iris' + (UID++);
      body = scene(j, SC, t) + `<clipPath id="${id}"><circle cx="${T.cx}" cy="${T.cy}" r="${f(r)}"/></clipPath><g clip-path="url(#${id})">${backdrop(t, j + 1, t - b)}${scene(j + 1, t - b, t)}</g><circle cx="${T.cx}" cy="${T.cy}" r="${f(r)}" fill="none" stroke="${T.ring}" stroke-width="${f(18 * (1 - k) + 4)}"/>`;
    }
    if (T.k === 'wipe' && t > b - .32 && t < b + .32) {
      const panel = (lag, col) => {
        const tt = t - lag; if (tt < b - .3 || tt > b + .3) return '';
        const v = tt < b ? lerp(1, 0, eout(prog(tt, b - .3, b))) : lerp(0, -1, ein(prog(tt, b, b + .3)));
        const tr = T.axis === 'y' ? `translate(0 ${f(v * 1300)})` : `translate(${f(-v * 760)} 0)`;
        return `<g transform="${tr}"><rect x="-40" y="-20" width="800" height="1320" fill="${col}"/></g>`;
      };
      over += panel(.1, T.cols[0]) + panel(0, T.cols[1]);
    }
    if (T.k === 'grow') {
      if (t > b - .35 && t < b) { const k = ein(prog(t, b - .35, b)); over += `<circle cx="${T.from[0]}" cy="${T.from[1]}" r="${f(18 + k * 1500)}" fill="${C.yel}" ${ST}/>`; }
      if (t >= b && t < b + CUE.cta.match) {
        const k = eio(prog(t, b, b + CUE.cta.match));
        over += `<circle cx="${f(lerp(T.from[0], T.to[0], k))}" cy="${f(lerp(T.from[1], T.to[1], k))}" r="${f(lerp(1500, 150, k))}" fill="${C.yel}" ${ST}/>`;
      }
    }
  });
  return { i, l, body, over };
}

/* ---------- bingkai ---------- */
function chrome(t) {
  let s = `<g transform="translate(360 168)"><rect x="-200" y="-26" width="400" height="52" rx="26" fill="${C.ink}"/>${txt(0, 9, 'BOKEK ANONIM · SESI #1', { size: 22, fill: C.yel, ls: 2 })}</g>`;
  for (let i = 0; i < 6; i++) {
    const x = 90 + i * 92, k = prog(t, i * SC, (i + 1) * SC);
    s += `<rect x="${x}" y="1088" width="80" height="8" rx="4" fill="${C.ink}" opacity=".15"/><rect x="${x}" y="1088" width="${f(80 * k)}" height="8" rx="4" fill="${C.ink}"/>`;
  }
  return s;
}

/* ---------- audio: diturunkan dari CUE (tidak ada angka waktu ganda) ---------- */
(() => {
  const E = [], add = (t, type, o = {}) => E.push({ t: +t.toFixed(3), type, ...o });
  const H = CUE.hook, D = CUE.data, I = CUE.inti, P = CUE.dampak, K = CUE.cta;
  add(0, 'impact', { gain: .45 });
  CUE.bounds.forEach(b => { add(b - .32, 'whoosh', { d: .5, gain: .85 }); add(b, 'thud', { gain: .45 }); });
  // hook
  H.bills.forEach((b, i) => { add(b, 'swipe', { gain: .45, pan: .4 }); add(b + .45, 'minus', { gain: .5 }); });
  add(H.cal[0], 'ticks', { d: H.cal[1] - H.cal[0], step: (H.cal[1] - H.cal[0]) / 9, gain: .45, pan: .5 });
  add(H.stamp - 1.1, 'riser', { d: 1.1, gain: .45 });
  add(H.stamp, 'impact', { gain: .9 }); add(H.stamp, 'clap', { gain: .9 });
  // data
  D.bars.forEach(b => { add(S0(1) + b, 'ticks', { d: D.barDur, step: .1, gain: .4 }); add(S0(1) + b + D.barDur, 'pop', { gain: .7 }); });
  D.pouches.forEach((b, i) => add(S0(1) + b + .28, 'thud', { gain: .5, pan: (i - 1) * .5 }));
  // inti x2
  [2, 3].forEach(sc => {
    const o = S0(sc);
    add(o + I.pouch, 'pop', { gain: .7 });
    for (let i = 0; i < 6; i++) add(o + I.coin0 + i * I.coinStep + I.coinDur, 'coin', { gain: .45, pan: sc === 2 ? .3 : -.3 });
    add(o + I.coin0, 'ticks', { d: I.amtEnd - I.coin0, step: .1, gain: .25 });
    I.icons.forEach(b => add(o + b, 'pop', { gain: .5 }));
    add(o + I.amtEnd, 'income', { gain: .8 }); add(o + I.amtEnd, 'thud', { gain: .5 });
    I.chips.forEach((b, i) => add(o + b, 'pluck', { note: 72 + i * 4, gain: .8 }));
  });
  // dampak
  const o5 = S0(4);
  add(o5 + P.cardA, 'pop', { gain: .7, pan: -.4 });
  add(o5 + P.x, 'impact', { gain: .7 }); add(o5 + P.x, 'clap', { gain: .8 });
  add(o5 + P.arrow[0], 'swipe', { gain: .4 });
  add(o5 + P.cardB, 'pop', { gain: .7, pan: .4 });
  P.coins.forEach(b => add(o5 + b + .45, 'coin', { gain: .45, pan: .4 }));
  add(o5 + P.fill[0], 'ticks', { d: P.fill[1] - P.fill[0], step: .1, gain: .3 });
  add(o5 + P.check, 'thud', { gain: .7 }); add(o5 + P.check, 'bell', { f: 1318, gain: .5 }); add(o5 + P.check, 'sparkle', { gain: .6 });
  // cta
  const o6 = S0(5);
  add(o6 + K.match, 'thud', { gain: .7 }); add(o6 + K.logo, 'pop', { gain: .8 });
  add(o6 + K.btn, 'pop', { gain: .7 }); add(o6 + K.press, 'tick', { gain: 1 }); add(o6 + K.saved, 'sparkle', { gain: .7 });
  window.AUDIO_EVENTS = E;
})();
// musik berstruktur: intro → drop → breakdown (adegan 4) → build + riser → DROP di adegan Dampak → akord penutup
window.MUSIC = { engine: 'studio', bpm: 120, bars: ['C', 'G', 'Am', 'F'], breaks: [[10.5, 14]], build: [13, 14], final: 19.5, final_chord: 'C',
  arp_from: 3.5, hat_from: 2, clap_from: 2, volume: 1, sfxGain: 1, lufs: -14 };

/* ---------- render ---------- */
const svg = document.getElementById('v');
function renderAt(t) {
  UID = 0;
  const S = stage(t);
  svg.innerHTML = `<g transform="${shake(t)}">${backdrop(t, S.i, S.l)}${S.body}${foreground(t, S.l)}${S.over}</g>` + chrome(t)
    + `<rect width="720" height="1280" fill="${C.ink}" opacity="${f(prog(t, DURATION - .35, DURATION))}"/>`;
}
window.renderAt = renderAt;
window.READY = Promise.all([600, 800, 900].map(w => document.fonts.load(`${w} 40px Pop`)));

if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else window.READY.then(() => { const st = performance.now(); const loop = () => { renderAt(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
</script>
</body>
</html>
