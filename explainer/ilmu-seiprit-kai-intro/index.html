<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kai · Intro Ilmu Seiprit</title>
<style>
  @font-face { font-family: Pop; src: url(fonts/poppins-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Pop; src: url(fonts/poppins-800.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Pop; src: url(fonts/poppins-900.woff2) format('woff2'); font-weight: 900; }
  html, body { margin: 0; background: #1f1b2e; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { height: 100vh; width: auto; aspect-ratio: 9 / 16; display: block; font-family: Pop, sans-serif; }
  body.render { display: block; min-height: 0; }
  body.render svg { width: 720px; height: 1280px; }
</style>
</head>
<body>
<svg id="v" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* Kai (maskot Ilmu Seiprit), palet "Permen Kapas", pose Tunas Ide. 6 dtk, bisa jadi intro/penutup. */
const DURATION = 6; window.DURATION = DURATION;
const P = { ink: '#1f1b2e', white: '#ffffff', body: '#ff9ec4', shine: '#ffd3e6', fold: '#f06fa2', cheek: '#ff5a5f', leaf: '#5fe0a8', yel: '#ffd23f', bg1: '#8b7bff', bg2: '#4fc3ff', mint: '#5fe0a8' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eout = k => 1 - Math.pow(1 - k, 3);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const spr = (dt, z = .38, w = 16) => { if (dt <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * dt) * (Math.cos(wd * dt) + z / Math.sqrt(1 - z * z) * Math.sin(wd * dt)); };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const f = n => (+n).toFixed(1);
const O = (w = 12) => `stroke="${P.ink}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const star = (r, fill = P.white, sw = 9) => { let d = ''; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * .4 : r; d += `${i ? 'L' : 'M'}${f(Math.cos(a) * rr)} ${f(Math.sin(a) * rr)} `; } return `<path d="${d}Z" fill="${fill}" stroke="${P.ink}" stroke-width="${sw}" stroke-linejoin="round"/>`; };

/* ---------- Kai (kotak 512, kaki di y≈414) ---------- */
const BODY = 'M112 300 C98 222 142 152 212 152 C232 120 290 118 314 150 C382 148 422 212 406 292 C400 362 332 394 258 394 C178 394 118 362 112 300 Z';
function kai(o) {
  // o: wave (derajat ayunan lengan), sprout (derajat), look [x,y], eyes 'open'|'blink'|'star', mouth 'smile'|'o'|'grin'
  let s = '';
  s += `<ellipse cx="216" cy="398" rx="28" ry="16" fill="${P.body}" ${O(11)}/><ellipse cx="300" cy="398" rx="28" ry="16" fill="${P.body}" ${O(11)}/>`;
  // lengan kanan (diam, sedikit berayun)
  s += `<g transform="rotate(${f(o.rest || 0)} 402 318)"><path d="M402 318 C426 330 432 350 424 366" fill="none" ${O(30)}/><path d="M402 318 C426 330 432 350 424 366" fill="none" stroke="${P.body}" stroke-width="16" stroke-linecap="round"/><circle cx="422" cy="372" r="17" fill="${P.body}" ${O(10)}/></g>`;
  // tunas
  s += `<g transform="rotate(${f(o.sprout)} 262 152)"><path d="M262 150 C262 112 254 92 270 70" fill="none" ${O(10)}/><path d="M270 72 C300 40 350 46 356 64 C330 92 292 92 270 72 Z" fill="${P.leaf}" ${O(10)}/><path d="M266 92 C240 70 206 74 200 90 C220 110 252 108 266 92 Z" fill="${P.leaf}" ${O(9)}/></g>`;
  // badan otak
  s += `<path d="${BODY}" fill="${P.body}" ${O(13)}/><path d="M140 250 C150 200 190 176 230 176" fill="none" stroke="${P.shine}" stroke-width="16" stroke-linecap="round"/>`;
  s += `<path d="M262 138 C250 168 270 192 256 222" fill="none" stroke="${P.ink}" stroke-width="9" stroke-linecap="round"/><path d="M190 196 q22 -8 30 12 M320 186 q-18 10 -6 30 q10 12 28 6 M350 250 q-20 0 -26 14" fill="none" stroke="${P.fold}" stroke-width="10" stroke-linecap="round"/>`;
  // mata
  [[204, 284], [312, 284]].forEach(([x, y]) => {
    if (o.eyes === 'blink') s += `<path d="M${x - 26} ${y + 2} q26 16 52 0" fill="none" ${O(9)}/>`;
    else if (o.eyes === 'star') s += `<ellipse cx="${x}" cy="${y}" rx="32" ry="38" fill="${P.ink}"/><g transform="translate(${x} ${y}) rotate(${f(o.spin || 0)})">${star(24, P.yel, 0)}</g><circle cx="${x - 12}" cy="${y - 18}" r="6" fill="${P.white}"/>`;
    else { const [lx, ly] = o.look || [0, 0]; s += `<ellipse cx="${x}" cy="${y}" rx="30" ry="38" fill="${P.ink}"/><circle cx="${x - 9 + lx}" cy="${y - 14 + ly}" r="12" fill="${P.white}"/><circle cx="${x + 9 + lx}" cy="${y + 12 + ly}" r="5.5" fill="${P.white}"/>`; }
  });
  s += `<ellipse cx="160" cy="330" rx="22" ry="12" fill="${P.cheek}" opacity=".75"/><ellipse cx="356" cy="330" rx="22" ry="12" fill="${P.cheek}" opacity=".75"/>`;
  if (o.mouth === 'o') s += `<ellipse cx="258" cy="334" rx="13" ry="16" fill="${P.ink}"/>`;
  else if (o.mouth === 'grin') s += `<path d="M226 320 q32 40 64 0 z" fill="${P.ink}" ${O(6)}/><ellipse cx="258" cy="342" rx="15" ry="8" fill="#ff7aa2"/>`;
  else s += `<path d="M234 326 q24 30 48 0 z" fill="${P.ink}" ${O(6)}/><ellipse cx="258" cy="342" rx="12" ry="7" fill="#ff7aa2"/>`;
  // lengan kiri melambai (pivot di bahu)
  s += `<g transform="rotate(${f(o.wave)} 118 318)"><path d="M118 318 C92 300 80 270 88 244" fill="none" ${O(30)}/><path d="M118 318 C92 300 80 270 88 244" fill="none" stroke="${P.body}" stroke-width="16" stroke-linecap="round"/><circle cx="88" cy="236" r="18" fill="${P.body}" ${O(10)}/></g>`;
  return s;
}

/* ---------- adegan ---------- */
const T = { enter: .1, wave: [.7, 1.7], blink: [1.25, 1.38], think: [1.75, 2.45], squash: [2.45, 2.62], ngeh: 2.62, title: 3.0, tag: 3.35, blink2: [4.6, 4.72] };
function bg(t) {
  let s = `<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P.bg1}"/><stop offset="1" stop-color="${P.bg2}"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect x="-40" y="-40" width="800" height="1360" fill="url(#bg)"/>`;
  const rot = t * 10 + eout(prog(t, T.ngeh, T.ngeh + .8)) * 30;
  s += `<g transform="translate(360 600) rotate(${f(rot)})">`;
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; s += `<path d="M0 0 L${f(Math.cos(a - .1) * 1100)} ${f(Math.sin(a - .1) * 1100)} L${f(Math.cos(a + .1) * 1100)} ${f(Math.sin(a + .1) * 1100)} Z" fill="#ffffff" opacity=".13"/>`; }
  s += `</g><circle cx="360" cy="600" r="${f(330 + Math.sin(t * 2) * 10 + eout(prog(t, T.ngeh, T.ngeh + .4)) * 60 * (1 - prog(t, T.ngeh + .4, T.ngeh + 1.2)))}" fill="url(#glow)"/>`;
  // konfeti melayang pelan (selalu ada)
  const cols = [P.yel, P.mint, '#ffffff', '#ff7aa2'];
  for (let i = 0; i < 22; i++) {
    const x = rnd(i) * 720 + Math.sin(t * 1.3 + i) * 18, y = 1320 - ((t * (30 + rnd(i + 5) * 40) + rnd(i + 9) * 1400) % 1400), r = 6 + rnd(i + 2) * 6;
    s += i % 2 ? `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${cols[i % 4]}" stroke="${P.ink}" stroke-width="3.5"/>` : `<rect x="${f(x - r)}" y="${f(y - r)}" width="${f(r * 2)}" height="${f(r * 2)}" rx="3" fill="${cols[i % 4]}" stroke="${P.ink}" stroke-width="3.5" transform="rotate(${f(t * 90 + i * 30)} ${f(x)} ${f(y)})"/>`;
  }
  return s;
}
function burst(t, front) { // ledakan konfeti (belakang Kai) + kilau (depan) saat "ngeh"
  const k = prog(t, T.ngeh, T.ngeh + 1.1); if (k <= 0 || k >= 1) return '';
  let s = '';
  if (!front) {
  const cols = [P.yel, P.mint, '#ffffff', '#ff7aa2', P.bg1];
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + rnd(i) * .3, d = eout(k) * (260 + rnd(i + 4) * 160), x = 360 + Math.cos(a) * d, y = 560 + Math.sin(a) * d + k * k * 220, sz = (1 - k * .6) * (8 + rnd(i + 1) * 8);
    s += `<rect x="${f(x - sz)}" y="${f(y - sz / 2)}" width="${f(sz * 2)}" height="${f(sz)}" rx="3" fill="${cols[i % 5]}" stroke="${P.ink}" stroke-width="3" transform="rotate(${f(k * 540 + i * 40)} ${f(x)} ${f(y)})"/>`;
  }
  return s; }
  [[150, 360, 46], [585, 330, 54], [120, 760, 34], [610, 760, 40]].forEach(([x, y, r], i) => {
    const kk = spr(t - T.ngeh - i * .06, .35, 20) * (1 - prog(t, T.ngeh + .8, T.ngeh + 1.1));
    if (kk > 0) s += `<g transform="translate(${x} ${y}) rotate(${f(t * 90)}) scale(${f(kk)})">${star(r, i % 2 ? P.yel : '#ffffff', 8)}</g>`;
  });
  return s;
}
function thought(t) { // gelembung pikiran saat mikir
  const out = prog(t, T.ngeh - .1, T.ngeh + .05);
  let s = '';
  [[520, 420, 14, 0], [556, 372, 22, .12], [600, 300, 46, .24]].forEach(([x, y, r, d], i) => {
    const k = spr(t - T.think[0] - d, .45, 18) * (1 - out);
    if (k > 0) s += `<circle cx="${x}" cy="${f(y + Math.sin(t * 4 + i) * 4)}" r="${f(r * k)}" fill="#ffffff" stroke="${P.ink}" stroke-width="6"/>`;
  });
  const qk = spr(t - T.think[0] - .36, .4, 16) * (1 - out);
  if (qk > 0) s += `<text x="600" y="${f(318 + Math.sin(t * 4) * 4)}" text-anchor="middle" font-size="${f(48 * qk)}" font-weight="900" fill="${P.bg1}">?</text>`;
  return s;
}
const _cv = document.createElement('canvas').getContext('2d');
function title(t) {
  let s = '';
  const words = ['Ilmu', 'Seiprit'];
  _cv.font = '900 96px Pop';
  const ws = words.map(w => _cv.measureText(w).width - 2 * w.length), gap = 26, tot = ws[0] + ws[1] + gap;
  words.forEach((w, i) => {
    const k = spr(t - T.title - i * .12, .42, 16); if (k <= 0) return;
    const x = 360 - tot / 2 + (i ? ws[0] + gap + ws[1] / 2 : ws[0] / 2);
    s += `<g transform="translate(${x} ${f(1010 + (1 - k) * 80)}) scale(${f(clamp(k, 0, 1.2))}) rotate(${f((1 - k) * -8)})"><text text-anchor="middle" font-size="96" font-weight="900" fill="#ffffff" stroke="${P.ink}" stroke-width="12" paint-order="stroke" letter-spacing="-2">${w}</text></g>`;
  });
  const tk = spr(t - T.tag, .5, 16);
  if (tk > 0) s += `<g transform="translate(360 1092) scale(${f(tk)})"><rect x="-230" y="-40" width="460" height="74" rx="37" fill="${P.yel}" stroke="${P.ink}" stroke-width="7"/><text y="13" text-anchor="middle" font-size="38" font-weight="900" fill="${P.ink}">Dikit, tapi nempel.</text></g>`;
  return s;
}
function kaiAt(t) {
  const enter = spr(t - T.enter, .4, 14);
  const sq = Math.sin(prog(t, T.squash[0], T.squash[1]) * Math.PI / 2) * (t < T.ngeh ? 1 : 0);
  const jump = t >= T.ngeh ? Math.sin(prog(t, T.ngeh, T.ngeh + .5) * Math.PI) : 0;
  const land = t >= T.ngeh + .5 ? Math.max(0, 1 - (t - T.ngeh - .5) / .25) * Math.cos((t - T.ngeh - .5) * 30) : 0;
  const idle = Math.sin(t * 4.2) * (t > 3 ? 1 : .5);
  const sx = 1 + sq * .14 - jump * .08 + land * .1 + idle * .015, sy = 1 - sq * .16 + jump * .12 - land * .1 - idle * .015;
  const y = 600 + (1 - enter) * 700 - jump * 120 + idle * 6;
  const thinking = t > T.think[0] && t < T.ngeh;
  const o = {
    wave: t > T.wave[0] && t < T.wave[1] ? Math.sin((t - T.wave[0]) * 14) * 26 * Math.sin(prog(t, T.wave[0], T.wave[1]) * Math.PI) : (t > T.ngeh ? -25 * Math.sin(prog(t, T.ngeh, T.ngeh + .5) * Math.PI) : 0),
    rest: t > T.ngeh ? -30 * Math.sin(prog(t, T.ngeh, T.ngeh + .5) * Math.PI) : Math.sin(t * 3) * 4,
    sprout: Math.sin(t * 6) * 8 + (1 - spr(t - T.enter - .2, .2, 14)) * 30 + (t > T.ngeh ? Math.sin((t - T.ngeh) * 18) * 18 * Math.max(0, 1 - (t - T.ngeh) / .8) : 0),
    look: thinking ? [8 * eio(prog(t, T.think[0], T.think[0] + .2)), -10 * eio(prog(t, T.think[0], T.think[0] + .2))] : [0, 0],
    eyes: t >= T.ngeh && t < 4.3 ? 'star' : ((t > T.blink[0] && t < T.blink[1]) || (t > T.blink2[0] && t < T.blink2[1]) ? 'blink' : 'open'),
    spin: (t - T.ngeh) * 120,
    mouth: t >= T.ngeh && t < 4.3 ? 'grin' : (thinking ? 'o' : 'smile'),
  };
  const sh = `<ellipse cx="360" cy="${f(600 + 1.15 * 158)}" rx="${f(150 * (1 - jump * .35))}" ry="22" fill="${P.ink}" opacity="${f(.22 * enter)}"/>`;
  return sh + `<g transform="translate(360 ${f(y)}) scale(${f(1.15 * sx)} ${f(1.15 * sy)}) rotate(${f(Math.sin(t * 2.5) * 2)}) translate(-258 -256)">${kai(o)}</g>`;
}
const svg = document.getElementById('v');
function renderAt(t) {
  svg.innerHTML = bg(t) + burst(t, false) + kaiAt(t) + thought(t) + burst(t, true) + title(t)
    + `<text x="360" y="1210" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff" opacity="${f(prog(t, 3.8, 4.2))}">@ilmuseiprit</text>`;
}
window.renderAt = renderAt;

/* ---------- audio ---------- */
window.AUDIO_EVENTS = [
  { t: T.enter + .05, type: 'whoosh', d: .4, f0: 400, f1: 3000, gain: .6 }, { t: .45, type: 'pop', gain: .9 }, { t: .5, type: 'thud', gain: .5 },
  { t: .8, type: 'pluck', note: 79, gain: .8 }, { t: 1.05, type: 'pluck', note: 83, gain: .8 }, { t: T.blink[0], type: 'tick', gain: .6 },
  { t: T.think[0], type: 'plink', gain: .6 }, { t: T.think[0] + .12, type: 'plink', gain: .6 }, { t: T.think[0] + .24, type: 'plink', gain: .7 },
  { t: 1.75, type: 'riser', d: .87, gain: .45 },
  { t: T.ngeh, type: 'impact', gain: .55 }, { t: T.ngeh, type: 'sparkle', gain: .9 }, { t: T.ngeh, type: 'bell', f: 1568, gain: .5 }, { t: T.ngeh, type: 'clap', gain: .6 },
  { t: T.ngeh + .5, type: 'thud', gain: .5 },
  { t: T.title, type: 'pop', gain: .8 }, { t: T.title + .12, type: 'pop', gain: .8 }, { t: T.tag, type: 'pluck', note: 84, gain: .9 },
  { t: T.blink2[0], type: 'tick', gain: .5 },
];
window.MUSIC = { engine: 'studio', bpm: 120, bars: ['C', 'G', 'Am', 'F'], breaks: [[1.75, 2.62]], final: 5.2, final_chord: 'C', arp_from: 0, hat_from: .5, clap_from: 2.62, volume: .9, sfxGain: 1, lufs: -14 };

window.READY = Promise.all([600, 800, 900].map(w => document.fonts.load(`${w} 40px Pop`)));
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
else window.READY.then(() => { const st = performance.now(); const loop = () => { renderAt(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
</script>
</body>
</html>
