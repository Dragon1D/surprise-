<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Carousel H1 · Uang Saku</title>
<style>
  @font-face { font-family: Pop; src: url(fonts/poppins-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Pop; src: url(fonts/poppins-800.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Pop; src: url(fonts/poppins-900.woff2) format('woff2'); font-weight: 900; }
  html, body { margin: 0; background: #1d1b26; }
  svg { display: block; font-family: Pop, sans-serif; }
</style>
</head>
<body>
<svg id="v" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* Carousel H1 "Uang saku 1,5 juta: biar nggak minjem temen tanggal 20" — 7 slide.
   ?slide=1..7&r=45 (IG 1080x1350) | r=916 (TikTok mode foto 1080x1920, isi dikecilkan ke zona aman). */
const C = { bg: '#f4ede1', ink: '#1d1b26', yel: '#ffd84d', cor: '#ef6f50', corD: '#c9553b', vio: '#5b4bff', vioD: '#4335d8', grn: '#1fa971', grnD: '#168457', red: '#e5483b', mute: '#6b6357', white: '#fffdf6' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const f = n => (+n).toFixed(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const ST = `stroke="${C.ink}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
const txt = (x, y, s, o = {}) => `<text x="${f(x)}" y="${f(y)}" text-anchor="${o.anchor || 'middle'}" font-size="${o.size || 32}" font-weight="${o.weight || 800}" fill="${o.fill || C.ink}" letter-spacing="${o.ls || 0}" opacity="${o.op ?? 1}">${esc(s)}</text>`;
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function bill(w = 220, h = 110) {
  return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="16" fill="${C.yel}" ${ST}/>
    <rect x="${-w / 2 + 16}" y="${-h / 2 + 14}" width="${w - 32}" height="${h - 28}" rx="10" fill="none" stroke="${C.ink}" stroke-width="3" opacity=".35"/>
    <circle r="${h * .26}" fill="${C.white}" ${ST}/>${txt(0, h * .1, 'Rp', { size: h * .26 })}`;
}
function coin(r = 26) { return `<circle r="${r}" fill="${C.yel}" ${ST}/><circle r="${r * .66}" fill="none" stroke="${C.ink}" stroke-width="3" opacity=".4"/>${txt(0, r * .32, 'Rp', { size: r * .8 })}`; }
// kantong: karung kain bertali (leher dikerut, lipatan kain, tali menjuntai); fill 0..1 naik dari bawah
function pouch(col, colD, fill = 0, label = '', amount = '', s = 1, face = 'ok') {
  const body = 'M-52 -58 C-98 -42 -126 8 -112 58 C-100 104 -58 116 0 116 C58 116 100 104 112 58 C126 8 98 -42 52 -58 Z';
  const fh = 176 * clamp(fill), id = 'pc' + col.slice(1);
  let g = `<g transform="scale(${s})"><defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>`;
  g += `<path d="${body}" fill="${C.white}"/>`;
  g += `<g clip-path="url(#${id})"><rect x="-130" y="${f(116 - fh)}" width="260" height="${f(fh + 2)}" fill="${col}"/>`;
  // bayangan kain di sisi kanan
  g += `<path d="M70 -40 C112 0 116 70 60 112 L140 112 L140 -60 Z" fill="${C.ink}" opacity=".08"/></g>`;
  // lipatan kain dari leher ke badan
  g += `<path d="M-34 -52 Q-50 -28 -44 -2 M34 -52 Q50 -28 44 -2 M-6 -56 Q-2 -42 -8 -26 M-70 92 Q-40 104 -14 100" fill="none" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round" opacity=".45"/>`;
  g += `<path d="${body}" fill="none" ${ST}/>`;
  // kerutan kain di atas ikatan
  g += `<path d="M-50 -60 L-74 -104 Q-56 -90 -40 -108 Q-20 -90 0 -110 Q20 -90 40 -108 Q56 -90 74 -104 L50 -60 Z" fill="${colD}" ${ST}/>`;
  g += `<rect x="-62" y="-72" width="124" height="20" rx="10" fill="${C.ink}"/>`;
  // tali menjuntai dengan simpul
  g += `<path d="M48 -62 C84 -56 98 -28 90 6 M48 -62 C74 -48 74 -26 64 -10" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="10" r="7" fill="${C.ink}"/><circle cx="63" cy="-6" r="6" fill="${C.ink}"/>`;
  // wajah kecil
  if (face === 'ok') g += `<circle cx="-26" cy="26" r="7" fill="${C.ink}"/><circle cx="26" cy="26" r="7" fill="${C.ink}"/><path d="M-14 48 q14 12 28 0" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`;
  if (face === 'sad') g += `<circle cx="-26" cy="26" r="7" fill="${C.ink}"/><circle cx="26" cy="26" r="7" fill="${C.ink}"/><path d="M-14 54 q14 -12 28 0" fill="none" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`;
  if (label) g += txt(0, 156, label, { size: 30 });
  if (amount) g += txt(0, 196, amount, { size: 34, fill: colD });
  return g + '</g>';
}
const ICON = {
  rumah: `<path d="M-38 -4 L0 -38 L38 -4" fill="none" ${ST}/><rect x="-30" y="-8" width="60" height="44" rx="6" fill="${C.white}" ${ST}/><rect x="-9" y="12" width="18" height="24" rx="3" fill="${C.cor}" ${ST}/>`,
  makan: `<path d="M-40 -2 h80 a40 36 0 0 1 -80 0z" fill="${C.white}" ${ST}/><path d="M-14 -14 q-8 -12 0 -24 M6 -14 q-8 -12 0 -24" fill="none" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`,
  bus: `<rect x="-40" y="-32" width="80" height="58" rx="12" fill="${C.yel}" ${ST}/><rect x="-28" y="-20" width="24" height="18" rx="3" fill="${C.white}" stroke="${C.ink}" stroke-width="3"/><rect x="4" y="-20" width="24" height="18" rx="3" fill="${C.white}" stroke="${C.ink}" stroke-width="3"/><circle cx="-22" cy="28" r="9" fill="${C.ink}"/><circle cx="22" cy="28" r="9" fill="${C.ink}"/>`,
  kopi: `<path d="M-28 -20 h56 l-8 54 h-40 z" fill="${C.white}" ${ST}/><path d="M28 -6 q20 0 16 18 q-4 12 -18 10" fill="none" ${ST}/><rect x="-32" y="-30" width="64" height="12" rx="5" fill="${C.cor}" ${ST}/>`,
  tiket: `<path d="M-44 -24 h88 v14 a10 10 0 0 0 0 20 v14 h-88 v-14 a10 10 0 0 0 0 -20 z" fill="${C.yel}" ${ST}/><path d="M10 -18 v36" stroke="${C.ink}" stroke-width="3" stroke-dasharray="5 5"/>`,
  belanja: `<rect x="-32" y="-16" width="64" height="54" rx="8" fill="${C.cor}" ${ST}/><path d="M-16 -16 q0 -26 16 -26 q16 0 16 26" fill="none" ${ST}/>`,
};
function calendar(day) {
  return `<rect x="-62" y="-70" width="124" height="140" rx="18" fill="${C.white}" ${ST}/><rect x="-62" y="-70" width="124" height="40" rx="18" fill="${C.red}" ${ST}/>
    <rect x="-62" y="-48" width="124" height="18" fill="${C.red}"/><path d="M-62 -30 h124" stroke="${C.ink}" stroke-width="5"/>
    ${txt(0, -40, 'TANGGAL', { size: 16, fill: C.white, ls: 2 })}${txt(0, 46, String(day), { size: 66 })}`;
}
const LOGO = `<rect x="18" y="40" width="84" height="46" rx="14" fill="#ef6f50" stroke="#1d1b26" stroke-width="4.5"/><path d="M68 52 h34 v22 h-34 a11 11 0 0 1 0 -22z" fill="#c9553b" stroke="#1d1b26" stroke-width="4"/><circle cx="31" cy="57" r="10" fill="#1d1b26"/><circle cx="54" cy="57" r="10" fill="#1d1b26"/><path d="M41 56 h3" stroke="#1d1b26" stroke-width="4"/><circle cx="28" cy="54" r="3" fill="#fff" opacity=".7"/><circle cx="51" cy="54" r="3" fill="#fff" opacity=".7"/><path d="M30 74 q6 -6 12 0 q6 -6 12 0 q-6 5 -12 1 q-6 4 -12 -1z" fill="#1d1b26"/>`;
Object.assign(ICON, {
  brankas: `<rect x="-36" y="-34" width="72" height="66" rx="10" fill="${C.grn}" ${ST}/><circle cx="0" cy="-2" r="16" fill="${C.white}" ${ST}/><path d="M0 -2 l8 -8" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/><rect x="-28" y="32" width="12" height="8" fill="${C.ink}"/><rect x="16" y="32" width="12" height="8" fill="${C.ink}"/>`,
  payung: `<path d="M-44 0 a44 40 0 0 1 88 0 q-11 -9 -22 0 q-11 -9 -22 0 q-11 -9 -22 0 q-11 -9 -22 0z" fill="${C.yel}" ${ST}/><path d="M0 0 v30 a8 8 0 0 1 -16 0" fill="none" ${ST}/>`,
  struk: `<path d="M-30 -40 h60 v76 l-10 -7 l-10 7 l-10 -7 l-10 7 l-10 -7 l-10 7 z" fill="${C.white}" ${ST}/><path d="M-18 -22 h36 M-18 -8 h36 M-18 6 h22" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`,
});

const MARK = { '*': C.cor, '_': C.grn, '^': C.vio, '~': C.red };
// judul statis multi-warna: *coral* _hijau_ ^ungu^ ~merah~ (per kata)
function head(lines, y0, size, o = {}) {
  const lh = size * 1.13;
  return lines.map((line, i) => {
    const parts = line.split(' ').map((w, j) => { const m = w.match(/^([*_^~])(.+?)\1(.*)$/), sp = j ? ' ' : '';
      return m ? `<tspan>${sp}</tspan><tspan fill="${MARK[m[1]]}">${esc(m[2])}</tspan><tspan>${esc(m[3])}</tspan>` : `<tspan>${sp}${esc(w)}</tspan>`; }).join('');
    return `<text x="${o.x ?? 540}" y="${f(y0 + i * lh)}" text-anchor="${o.anchor || 'middle'}" font-size="${size}" font-weight="${o.weight || 900}" fill="${o.fill || C.ink}" letter-spacing="-2">${parts}</text>`;
  }).join('');
}
const _cv = document.createElement('canvas').getContext('2d');
const measure = (s, size, w = 800) => { _cv.font = `${w} ${size}px Pop`; return _cv.measureText(s).width; };
function chips(items, y, col, size = 36) {
  const ws = items.map(c => measure(c, size) + 52), gap = 18, total = ws.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
  let x = 540 - total / 2, s = '';
  items.forEach((c, i) => { s += `<g transform="translate(${f(x + ws[i] / 2)} ${y})"><rect x="${f(-ws[i] / 2)}" y="-34" width="${f(ws[i])}" height="68" rx="34" fill="${col}" ${ST}/>${txt(0, 13, c, { size, fill: C.white })}</g>`; x += ws[i] + gap; });
  return s;
}
function frame(n, inner) {
  let s = `<rect x="-200" y="-400" width="1480" height="2400" fill="${C.bg}"/>`;
  s += `<defs><pattern id="dots" width="54" height="54" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="4" fill="${C.ink}" opacity=".07"/></pattern></defs><rect x="-200" y="-400" width="1480" height="2400" fill="url(#dots)"/>`;
  s += `<g transform="translate(80 92)"><rect x="0" y="-34" width="290" height="68" rx="34" fill="${C.ink}"/>${txt(145, 11, 'BOKEK ANONIM', { size: 28, fill: C.yel, ls: 3 })}</g>`;
  s += txt(1000, 104, `${n}/7`, { size: 34, fill: C.mute, anchor: 'end' });
  for (let i = 0; i < 7; i++) s += `<rect x="${f(540 - 7 * 22 + i * 44)}" y="1296" width="${i === n - 1 ? 36 : 14}" height="14" rx="7" fill="${C.ink}" opacity="${i === n - 1 ? 1 : .2}"/>`;
  return s + inner;
}
function bar(active) { // bar 50/30/20, segmen aktif menyala
  const X0 = 80, W = 920, Y = 172, H = 60, seg = [[.5, C.cor, '50%'], [.3, C.vio, '30%'], [.2, C.grn, '20%']];
  let s = `<clipPath id="bc"><rect x="${X0}" y="${Y}" width="${W}" height="${H}" rx="20"/></clipPath><g clip-path="url(#bc)">`, acc = 0, lab = '';
  seg.forEach(([p, col, t], i) => { const x = X0 + acc * W; s += `<rect x="${f(x)}" y="${Y}" width="${f(p * W)}" height="${H}" fill="${col}" opacity="${i === active ? 1 : .22}"/>`; if (i) s += `<path d="M${f(x)} ${Y} v${H}" stroke="${C.ink}" stroke-width="5"/>`; lab += txt(x + p * W / 2, Y + 42, t, { size: 32, fill: i === active ? C.white : C.ink, weight: 900, op: i === active ? 1 : .55 }); acc += p; });
  return s + `</g><rect x="${X0}" y="${Y}" width="${W}" height="${H}" rx="20" fill="none" ${ST}/>` + lab;
}
function kantong(n, o) {
  let s = bar(o.idx);
  s += head([`Kantong ${o.idx + 1} · ${o.name}`], 340, 64);
  s += `<g transform="translate(330 780) rotate(-3)">${pouch(o.col, o.colD, .85, '', '', 2.05, 'ok')}</g>`;
  [[150, 470], [520, 470]].forEach(([x, y], i) => s += `<g transform="translate(${x} ${y}) scale(1.15)">${ICON[o.icons[i]]}</g>`);
  s += `<g transform="translate(560 1010) scale(1.15)">${ICON[o.icons[2]]}</g>`;
  s += txt(790, 640, o.pct, { size: 150, fill: o.col, weight: 900 });
  s += txt(790, 745, o.amt, { size: 76, fill: o.colD, weight: 900 });
  s += txt(790, 800, 'dari gaji Rp5 jt', { size: 32, fill: C.mute, weight: 600 });
  s += chips(o.items, 1130, o.colD);
  if (o.note) s += `<g transform="translate(540 1222)"><rect x="-280" y="-30" width="560" height="60" rx="30" fill="none" stroke="${C.ink}" stroke-width="4" stroke-dasharray="10 8"/>${txt(0, 11, o.note, { size: 30, weight: 800 })}</g>`;
  else s += txt(540, 1232, 'Angka contoh · hitung dari gaji bersih', { size: 28, fill: C.mute, weight: 600 });
  return frame(n, s);
}
// ---- ikon tambahan
const amplop = (lbl, amt, col) => `<rect x="-160" y="-85" width="320" height="170" rx="18" fill="${C.white}" ${ST}/><path d="M-160 -70 L0 10 L160 -70" fill="none" ${ST}/><rect x="-160" y="30" width="320" height="55" rx="0" fill="${col}" opacity=".9"/><rect x="-160" y="-85" width="320" height="170" rx="18" fill="none" ${ST}/>${txt(0, 68, `${lbl} · ${amt}`, { size: 30, fill: C.white, weight: 900 })}`;
const hp = (w, h, inner) => `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="40" fill="${C.ink}"/><rect x="${-w / 2 + 14}" y="${-h / 2 + 40}" width="${w - 28}" height="${h - 70}" rx="20" fill="${C.white}"/><rect x="-40" y="${-h / 2 + 14}" width="80" height="12" rx="6" fill="#3a3746"/>${inner}`;
const bubble = (x, y, w, s, out) => `<g transform="translate(${x} ${y})"><rect x="${out ? -w : 0}" y="-34" width="${w}" height="68" rx="26" fill="${out ? C.vio : '#e9e2d4'}"/>${txt(out ? -w / 2 : w / 2, 11, s, { size: 28, fill: out ? C.white : C.ink, weight: 800 })}</g>`;
const step = (n, y = 200) => `<g transform="translate(540 ${y})"><rect x="-110" y="-30" width="220" height="60" rx="30" fill="${C.yel}" ${ST}/>${txt(0, 11, 'LANGKAH ' + n, { size: 28, ls: 3, weight: 900 })}</g>`;
const arrowD = (x, y1, y2) => `<path d="M${x} ${y1} V${y2} M${x - 18} ${y2 - 18} L${x} ${y2} L${x + 18} ${y2 - 18}" fill="none" stroke="${C.ink}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;

const SLIDES = [
  // 1 hook
  n => {
    let s = head(['Uang saku 1,5 juta,', 'tanggal 20 udah', '~minjem~ temen?'], 280, 92);
    s += `<g transform="translate(400 880) rotate(-6)">${hp(360, 600, bubble(150, -150, 300, 'bro, pinjem 50rb', true) + bubble(150, -60, 220, 'dulu ya', true) + bubble(-160, 40, 130, 'lagi?', false) + bubble(150, 130, 260, 'janji tgl 1', true))}</g>`;
    s += `<g transform="translate(820 760) rotate(8) scale(1.45)">${calendar(20)}</g>`;
    s += `<g transform="translate(830 1000) rotate(-10)">${coin(40)}</g><g transform="translate(910 1060) rotate(14)">${coin(30)}</g>`;
    s += `<g transform="translate(540 1222)"><rect x="-270" y="-38" width="540" height="76" rx="38" fill="${C.ink}"/>${txt(-14, 13, 'Geser, ada caranya', { size: 34, fill: C.yel })}<path d="M200 0 h36 M222 -14 l14 14 l-14 14" fill="none" stroke="${C.yel}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    return frame(n, s);
  },
  // 2 masalah
  n => {
    let s = txt(540, 220, 'MASALAHNYA', { size: 34, ls: 6, fill: C.mute });
    s += head(['dibagi per *bulan*,', 'bukan per minggu'], 320, 80);
    const data = [[700, C.grn], [450, C.yel], [250, C.cor], [100, C.red]], base = 1060, k = .62;
    data.forEach(([v, col], i) => {
      const x = 225 + i * 210, h = v * k;
      s += `<rect x="${x - 70}" y="${f(base - h)}" width="140" height="${f(h)}" rx="18" fill="${col}" ${ST}/>`;
      s += txt(x, base - h - 22, `Rp${v}rb`, { size: 36, weight: 900 });
      s += txt(x, base + 50, `Mg ${i + 1}`, { size: 34, fill: C.mute });
    });
    s += `<path d="M110 ${base} H970" stroke="${C.ink}" stroke-width="6" stroke-linecap="round"/>`;
    s += head(['Minggu 1 kayak sultan,', 'minggu 4 nyari pinjaman.'], 1180, 40, { weight: 800 });
    s += txt(1000, 1262, 'angka contoh', { size: 24, fill: C.mute, weight: 600, anchor: 'end' });
    return frame(n, s);
  },
  // 3 langkah 1
  n => {
    let s = step(1) + head(['Sisihin yang _pasti_ dulu'], 320, 72);
    s += `<g transform="translate(540 470)"><rect x="-230" y="-52" width="460" height="104" rx="52" fill="${C.white}" ${ST}/>${txt(0, 20, 'Rp1.500.000', { size: 60, weight: 900 })}</g>`;
    s += `<path d="M450 530 Q330 560 300 610 M630 530 Q750 560 780 610" fill="none" stroke="${C.ink}" stroke-width="7" stroke-linecap="round"/>`;
    s += `<g transform="translate(300 730)">${pouch(C.vio, C.vioD, .7, '', '', .95, 'ok')}</g>${txt(300, 890, 'Kuota & pulsa', { size: 36 })}${txt(300, 940, 'Rp100rb', { size: 40, fill: C.vioD, weight: 900 })}`;
    s += `<g transform="translate(780 730)">${pouch(C.grn, C.grnD, .7, '', '', .95, 'ok')}</g>${txt(780, 890, 'Dana darurat mini', { size: 36 })}${txt(780, 940, 'Rp100rb', { size: 40, fill: C.grnD, weight: 900 })}`;
    s += `<g transform="translate(540 1080)"><rect x="-430" y="-56" width="860" height="112" rx="30" fill="${C.ink}"/>${txt(0, 18, 'sisa buat hidup: Rp1.300.000', { size: 46, fill: C.yel, weight: 900 })}</g>`;
    s += txt(540, 1220, 'Kebutuhan tetap tiap bulan, beda tiap orang', { size: 28, fill: C.mute, weight: 600 });
    return frame(n, s);
  },
  // 4 langkah 2
  n => {
    let s = step(2) + head(['Bagi per *minggu*,', 'bukan per bulan'], 320, 76);
    s += txt(540, 520, 'Rp1.300.000 ÷ 4 = Rp325.000/minggu', { size: 44, weight: 900, fill: C.corD });
    const cols = [C.cor, C.vio, C.grn, C.corD];
    [[300, 700], [780, 700], [300, 940], [780, 940]].forEach(([x, y], i) => s += `<g transform="translate(${x} ${y}) rotate(${(i % 2 ? 3 : -3)})">${amplop('Mg ' + (i + 1), 'Rp325rb', cols[i])}</g>`);
    s += `<g transform="translate(540 1150)"><rect x="-430" y="-34" width="860" height="68" rx="34" fill="none" stroke="${C.ink}" stroke-width="4" stroke-dasharray="10 8"/>${txt(0, 11, 'Bulan 5 minggu? Bagi 5 = Rp260.000/minggu', { size: 30 })}</g>`;
    return frame(n, s);
  },
  // 5 langkah 3
  n => {
    let s = step(3) + head(['Tiap Senin, pindahin', 'jatah ^minggu^ ^ini^ aja'], 320, 72);
    const scr = `${txt(0, -170, 'Transfer terjadwal', { size: 30, weight: 900 })}
      <g transform="translate(0 -80)"><rect x="-150" y="-40" width="300" height="80" rx="16" fill="#efe8da"/>${txt(-130, -8, 'Setiap', { size: 22, fill: C.mute, anchor: 'start', weight: 600 })}${txt(-130, 24, 'Senin', { size: 30, anchor: 'start' })}</g>
      <g transform="translate(0 20)"><rect x="-150" y="-40" width="300" height="80" rx="16" fill="#efe8da"/>${txt(-130, -8, 'Jumlah', { size: 22, fill: C.mute, anchor: 'start', weight: 600 })}${txt(-130, 24, 'Rp325.000', { size: 30, anchor: 'start' })}</g>
      <g transform="translate(0 120)"><rect x="-150" y="-40" width="300" height="80" rx="16" fill="#efe8da"/>${txt(-130, -8, 'Ke', { size: 22, fill: C.mute, anchor: 'start', weight: 600 })}${txt(-130, 24, 'Rekening jajan', { size: 30, anchor: 'start' })}</g>
      <g transform="translate(0 215)"><rect x="-150" y="-30" width="300" height="60" rx="30" fill="${C.grn}"/>${txt(0, 11, 'Aktif', { size: 30, fill: C.white })}</g>`;
    s += `<g transform="translate(330 860)">${hp(380, 620, scr)}</g>`;
    s += `<g transform="translate(790 640)">${pouch(C.cor, C.corD, .8, '', '', .9, 'ok')}</g>${txt(790, 790, 'Rekening utama', { size: 34 })}${txt(790, 832, 'jangan disentuh', { size: 30, fill: C.red })}`;
    s += arrowD(790, 870, 950);
    s += `<g transform="translate(790 1040)">${pouch(C.vio, C.vioD, .5, '', '', .7, 'ok')}</g>${txt(790, 1160, 'Rekening jajan', { size: 34 })}`;
    s += txt(540, 1240, 'Rekening kedua atau dompet digital terpisah', { size: 28, fill: C.mute, weight: 600 });
    return frame(n, s);
  },
  // 6 sisa / kurang
  n => {
    let s = head(['Minggu ini _sisa_?', 'Atau malah ~kurang~?'], 260, 76);
    const card = (x, title, col, lines, inner) => `<g transform="translate(${x} 780)"><rect x="-225" y="-330" width="450" height="660" rx="34" fill="${C.white}" stroke="${col}" stroke-width="9"/>${txt(0, -262, title, { size: 40, fill: col, weight: 900 })}${inner}${lines.map((l, i) => txt(0, 150 + i * 50, l, { size: 34 })).join('')}</g>`;
    s += card(290, 'SISA', C.grnD, ['Masukin ke dana', 'darurat mini', 'atau tabungan'], `<g transform="translate(0 -40)">${pouch(C.grn, C.grnD, .6, '', '', 1.0, 'ok')}</g><g transform="translate(0 -205)">${coin(30)}</g>${arrowD(0, -170, -150)}`);
    s += card(790, 'KURANG', C.red, ['Jangan ambil jatah', 'minggu depan.', 'Darurat? Pakai', 'dana darurat mini'], `<g transform="translate(0 -40)">${amplop('Mg 2', 'Rp325rb', C.vio)}<path d="M-90 -80 L90 90 M90 -80 L-90 90" stroke="${C.red}" stroke-width="16" stroke-linecap="round"/></g>`);
    s += txt(540, 1220, 'Habis dana darurat mini, isi lagi bulan depan', { size: 30, fill: C.mute, weight: 600 });
    return frame(n, s);
  },
  // 7 CTA
  n => {
    let s = head(['Simpan & kirim', 'ke _grup_ _kelas_'], 270, 88);
    s += `<g transform="translate(540 600) rotate(-4)"><circle r="165" fill="${C.yel}" ${ST}/><g transform="translate(-143 -156) scale(2.39)">${LOGO}</g></g>`;
    s += txt(540, 840, 'Bokek Anonim', { size: 62, weight: 900 });
    s += `<g transform="translate(540 1010)"><path d="M-400 -100 h800 a30 30 0 0 1 30 30 v130 a30 30 0 0 1 -30 30 h-640 l-60 50 l10 -50 h-110 a30 30 0 0 1 -30 -30 v-130 a30 30 0 0 1 30 -30 z" fill="${C.white}" ${ST}/>${txt(0, -18, 'Uang saku lu biasanya', { size: 48 })}${txt(0, 46, 'habis tanggal berapa? Jawab di komen', { size: 36, fill: C.corD })}</g>`;
    s += txt(540, 1236, 'Angka = contoh · sesuaikan dengan uang saku lu', { size: 26, fill: C.mute, weight: 600 });
    return frame(n, s);
  },
];

const q = new URLSearchParams(location.search), n = +(q.get('slide') || 1), tall = q.get('r') === '916';
const svg = document.getElementById('v');
window.READY = Promise.all([600, 800, 900].map(w => document.fonts.load(`${w} 40px Pop`))).then(() => {
  const W = 1080, H = tall ? 1920 : 1350;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
  // TikTok: isi 4:5 dikecilkan 0,9 dan diletakkan di zona aman (hindari tombol kanan & caption bawah)
  const body = SLIDES[n - 1](n);
  svg.innerHTML = tall ? `<rect width="${W}" height="${H}" fill="${C.bg}"/><g transform="translate(54 190) scale(.9)">${body}</g>` : body;
  document.title = 'ok';
});
</script>
