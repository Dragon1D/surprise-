<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Carelina</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F4EFEA; --ink: #3E3632; }
        body { background-color: var(--bg); color: var(--ink); font-family: 'Cormorant Garamond', serif; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        
        .frame {
            border: 2px solid var(--ink);
            padding: 10px;
            width: 250px;
            height: 300px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 2s ease;
        }
        .frame.show { opacity: 1; }
        .frame::after { content: 'Foto akan segera diisi'; font-style: italic; color: #888; }

        #intro { font-size: 1.5rem; letter-spacing: 2px; text-align: center; }
        .page { position: absolute; opacity: 0; transition: opacity 2s ease; max-width: 80%; text-align: center; pointer-events: none; flex-direction: column; align-items: center; justify-content: center; display: flex; }
        .active { opacity: 1; pointer-events: auto; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.4rem; line-height: 1.6; }
        .highlight { font-style: italic; display: block; margin-top: 20px; border-top: 1px solid var(--ink); padding-top: 20px; }
        .secret-box { margin-top: 30px; padding: 15px 25px; border: 1px dashed var(--ink); display: inline-block; font-size: 1.1rem; letter-spacing: 1px; background: rgba(244, 239, 234, 0.8); }
    </style>
</head>
<body>
    <div id="intro" class="active">Sentuh untuk membuka...</div>
    
    <div id="page1" class="page">
        <div class="frame" id="photoFrame"></div>
        <h1>Carelina.</h1>
        <p>30 Oktober.</p>
    </div>

    <div id="page2" class="page">
        <p>Seberapa keras kau memikul beban orang lain, seberapa sering kau melupakan dirimu sendiri.</p>
    </div>

    <div id="page3" class="page">
        <p class="highlight">Kau tidak pernah sendiri.<br>Aku di sini, menjadi rumah untukmu pulang.</p>
        <div class="secret-box">Selamat Ulang Tahun, Semestaku. 🤍</div>
    </div>

    <script>
        let stage = 0;
        const pages = [document.getElementById('intro'), document.getElementById('page1'), document.getElementById('page2'), document.getElementById('page3')];
        const frame = document.getElementById('photoFrame');
        
        document.body.addEventListener('click', () => {
            if (stage < pages.length - 1) {
                pages[stage].classList.remove('active');
                stage++;
                pages[stage].classList.add('active');
                if (stage === 1) frame.classList.add('show');
            }
        });
    </script>
</body>
</html>
