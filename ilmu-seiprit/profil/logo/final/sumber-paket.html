<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Ilmu Seiprit · paket logo</title>
<style>
  @font-face { font-family: Pop; src: url(../../../explainer/contoh-a-anonim/fonts/poppins-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Pop; src: url(../../../explainer/contoh-a-anonim/fonts/poppins-800.woff2) format('woff2'); font-weight: 800; }
  @font-face { font-family: Pop; src: url(../../../explainer/contoh-a-anonim/fonts/poppins-900.woff2) format('woff2'); font-weight: 900; }
  html, body { margin: 0; background: transparent; font-family: Pop, sans-serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="v" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* Ilmu Seiprit — maskot "Kai" (otak mungil). ?out=avatar|logo|ekspresi-<nama>|banner-yt|cover-fb|watermark */
const P = { teal: '#0f4c5c', tealD: '#0a3540', tealL: '#1c6a7d', lime: '#d7f75b', limeD: '#b0d334', cream: '#f6f7f2', ink: '#14232a', pink: '#ff7aa2', white: '#ffffff' };
const star = (r, fill = P.lime, sw = 10) => { let d = ''; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * .42 : r; d += `${i ? 'L' : 'M'}${(Math.cos(a) * rr).toFixed(1)} ${(Math.sin(a) * rr).toFixed(1)} `; } return `<path d="${d}Z" fill="${fill}" stroke="${P.ink}" stroke-width="${sw}" stroke-linejoin="round"/>`; };

// Kai dalam kotak 512 (pusat ~256,260). expr: senyum | kaget | mikir | ngeh
function kai(expr = 'senyum', withStar = true) {
  const body = 'M128 302 C104 226 150 152 228 144 C276 116 352 132 378 188 C424 212 418 300 376 320 C352 372 172 376 128 302 Z';
  let s = `<path d="${body}" fill="${P.lime}" stroke="${P.ink}" stroke-width="14" stroke-linejoin="round"/>`;
  // belahan otak + lipatan (gyri)
  s += `<path d="M262 140 C252 170 270 196 258 226" fill="none" stroke="${P.ink}" stroke-width="9" stroke-linecap="round"/>`;
  s += `<path d="M176 184 q24 -10 34 14 q8 20 30 12 M160 236 q26 -6 34 10 M300 172 q-20 14 -4 34 q14 16 36 6 M332 236 q-26 -4 -36 14" fill="none" stroke="${P.limeD}" stroke-width="10" stroke-linecap="round"/>`;
  const E = { L: [218, 278], R: [306, 278] };
  if (expr === 'senyum' || expr === 'mikir') {
    const look = expr === 'mikir' ? [8, -10] : [5, 3];
    [E.L, E.R].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="27" fill="${P.white}" stroke="${P.ink}" stroke-width="10"/><circle cx="${x + look[0]}" cy="${y + look[1]}" r="12" fill="${P.ink}"/><circle cx="${x + look[0] + 4}" cy="${y + look[1] - 4}" r="4" fill="${P.white}"/>`);
  }
  if (expr === 'kaget') [E.L, E.R].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="33" fill="${P.white}" stroke="${P.ink}" stroke-width="10"/><circle cx="${x}" cy="${y}" r="9" fill="${P.ink}"/>`);
  if (expr === 'ngeh') [E.L, E.R].forEach(([x, y]) => s += `<circle cx="${x}" cy="${y}" r="29" fill="${P.white}" stroke="${P.ink}" stroke-width="10"/><g transform="translate(${x} ${y})">${star(19, P.ink, 0)}</g>`);
  // pipi
  if (expr !== 'kaget') s += `<ellipse cx="184" cy="318" rx="16" ry="9" fill="${P.pink}" opacity=".75"/><ellipse cx="340" cy="318" rx="16" ry="9" fill="${P.pink}" opacity=".75"/>`;
  // mulut
  if (expr === 'senyum') s += `<path d="M240 322 q22 18 44 0" fill="none" stroke="${P.ink}" stroke-width="10" stroke-linecap="round"/>`;
  if (expr === 'kaget') s += `<ellipse cx="262" cy="326" rx="14" ry="17" fill="${P.ink}"/>`;
  if (expr === 'mikir') s += `<path d="M244 330 q12 -6 22 0 q10 6 20 0" fill="none" stroke="${P.ink}" stroke-width="9" stroke-linecap="round"/><g fill="${P.white}" stroke="${P.ink}" stroke-width="7"><circle cx="400" cy="140" r="12"/><circle cx="428" cy="104" r="17"/></g>`;
  if (expr === 'ngeh') s += `<path d="M232 316 q30 34 60 0 z" fill="${P.ink}"/><path d="M246 330 q16 10 32 0" fill="none" stroke="${P.pink}" stroke-width="8" stroke-linecap="round"/>`;
  if (withStar && expr !== 'mikir') s += `<g transform="translate(400 126) rotate(12)">${star(expr === 'ngeh' ? 52 : 40, P.white, 12)}</g>` + (expr === 'ngeh' ? `<g transform="translate(108 150) rotate(-10)">${star(26, P.lime, 9)}</g>` : '');
  if (expr === 'kaget') s += `<path d="M120 150 l-24 -22 M150 122 l-10 -30 M386 120 l14 -30" stroke="${P.ink}" stroke-width="10" stroke-linecap="round"/>`;
  return s;
}
const dots = (W, H, gap = 60, col = P.tealL) => { let s = ''; for (let y = gap / 2; y < H; y += gap) for (let x = (y / gap % 2) * gap / 2; x < W; x += gap) s += `<circle cx="${x}" cy="${y}" r="4" fill="${col}"/>`; return s; };

const q = new URLSearchParams(location.search), out = q.get('out') || 'avatar';
let W = 1080, H = 1080, s = '';
if (out === 'avatar') { s = `<rect width="1080" height="1080" fill="${P.teal}"/>${dots(1080, 1080)}<g transform="translate(540 560) scale(2.12) translate(-266 -252)">${kai('senyum')}</g>`; }
else if (out === 'logo') { s = `<g transform="translate(540 540) scale(1.9) translate(-264 -250)">${kai('senyum')}</g>`; }
else if (out.startsWith('ekspresi-')) { s = `<g transform="translate(540 540) scale(1.9) translate(-264 -250)">${kai(out.slice(9))}</g>`; }
else if (out === 'watermark') { W = 360; H = 120; s = `<g transform="translate(8 8) scale(.2)">${kai('senyum', false)}</g><text x="112" y="58" font-size="34" font-weight="900" fill="${P.white}" stroke="${P.ink}" stroke-width="6" paint-order="stroke">Ilmu Seiprit</text><text x="114" y="92" font-size="20" font-weight="800" fill="${P.lime}" stroke="${P.ink}" stroke-width="5" paint-order="stroke">@ilmuseiprit</text>`; }
else if (out === 'banner-yt') {
  W = 2560; H = 1440;
  s = `<rect width="2560" height="1440" fill="${P.teal}"/>${dots(2560, 1440, 70)}`;
  // area aman semua perangkat: 1546x423 di tengah (y 508–931)
  s += `<g transform="translate(507 498) scale(.86)">${kai('ngeh')}</g>`;
  s += `<text x="1000" y="700" font-size="150" font-weight="900" fill="${P.cream}" letter-spacing="-3">Ilmu Seiprit</text>`;
  s += `<text x="1006" y="800" font-size="64" font-weight="800" fill="${P.lime}">Dikit, tapi nempel.</text>`;
  s += `<g transform="translate(1006 846)"><rect width="760" height="70" rx="35" fill="${P.tealD}"/><text x="380" y="47" text-anchor="middle" font-size="36" font-weight="800" fill="${P.cream}">Fakta unik & "kenapa" tiap hari</text></g>`;
  [[260, 300, 60], [2280, 260, 46], [2350, 1180, 70], [200, 1160, 40]].forEach(([x, y, r]) => s += `<g transform="translate(${x} ${y})">${star(r, P.lime, 10)}</g>`);
}
else if (out === 'cover-fb') {
  W = 1640; H = 624;
  s = `<rect width="1640" height="624" fill="${P.teal}"/>${dots(1640, 624, 56)}`;
  s += `<g transform="translate(380 70) scale(.92)">${kai('ngeh')}</g>`;
  s += `<text x="880" y="300" font-size="104" font-weight="900" fill="${P.cream}" letter-spacing="-2">Ilmu Seiprit</text>`;
  s += `<text x="884" y="380" font-size="46" font-weight="800" fill="${P.lime}">Dikit, tapi nempel.</text>`;
  s += `<text x="884" y="440" font-size="30" font-weight="600" fill="${P.cream}" opacity=".85">Fakta unik & "kenapa" dari hal sehari-hari</text>`;
  [[150, 120, 40], [1520, 110, 34], [1540, 520, 46], [120, 520, 30]].forEach(([x, y, r]) => s += `<g transform="translate(${x} ${y})">${star(r, P.lime, 8)}</g>`);
}
else if (out === 'lembar') { // lembar ringkas untuk dicek
  W = 1600; H = 900;
  s = `<rect width="1600" height="900" fill="${P.cream}"/><text x="60" y="80" font-size="44" font-weight="900" fill="${P.ink}">Kai · 4 ekspresi</text>`;
  ['senyum', 'kaget', 'mikir', 'ngeh'].forEach((e, i) => { s += `<g transform="translate(${60 + i * 385} 140)"><rect width="340" height="340" rx="30" fill="${P.teal}"/><svg width="340" height="340" viewBox="0 0 512 512">${kai(e)}</svg><text x="170" y="390" text-anchor="middle" font-size="32" font-weight="900" fill="${P.ink}">${e}</text></g>`; });
  s += `<g transform="translate(60 600)"><svg width="230" height="230" viewBox="0 0 1080 1080"><defs><clipPath id="cc"><circle cx="540" cy="540" r="540"/></clipPath></defs><g clip-path="url(#cc)"><rect width="1080" height="1080" fill="${P.teal}"/>${dots(1080, 1080)}<g transform="translate(540 560) scale(2.12) translate(-266 -252)">${kai('senyum')}</g></g></svg>`;
  [[110, 260, 60], [56, 390, 120]].forEach(([w, x, y]) => s += `<svg x="${x}" y="${y}" width="${w}" height="${w}" viewBox="0 0 1080 1080"><g clip-path="url(#cc)"><rect width="1080" height="1080" fill="${P.teal}"/><g transform="translate(540 560) scale(2.12) translate(-266 -252)">${kai('senyum')}</g></g></svg>`);
  s += `<text x="520" y="110" font-size="30" font-weight="800" fill="${P.ink}">Avatar (tes ukuran 230 / 110 / 56 px)</text></g>`;
}
const v = document.getElementById('v');
v.setAttribute('width', W); v.setAttribute('height', H); v.setAttribute('viewBox', `0 0 ${W} ${H}`); v.innerHTML = s;
window.SIZE = [W, H];
window.READY = Promise.all([600, 800, 900].map(w => document.fonts.load(`${w} 40px Pop`)));
</script>
</body>
</html>
